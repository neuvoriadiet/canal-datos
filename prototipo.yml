name: Prototipo (datos, hechos y guion)

on:
  workflow_dispatch:
    inputs:
      estructura:
        description: Estructura narrativa
        type: choice
        default: pregunta_misterio_resolucion
        options:
          - pregunta_misterio_resolucion
          - cronologica
          - comparacion
          - mito_vs_dato
      proveedor:
        description: Proveedor de LLM
        type: choice
        default: gemini
        options:
          - gemini
          - cloudflare

permissions:
  contents: read

jobs:
  prototipo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar datos del Banco Mundial
        run: python src/fetch.py

      - name: Calcular hechos
        run: python src/facts.py

      - name: Generar y validar guion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ESTRUCTURA: ${{ inputs.estructura }}
          PROVEEDOR: ${{ inputs.proveedor }}
        run: python src/script.py --estructura "$ESTRUCTURA" --proveedor "$PROVEEDOR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototipo-datos
          path: |
            data/hechos.json
            data/guion.json
            data/guion.txt
            data/guion_rechazado.json
          if-no-files-found: ignore
